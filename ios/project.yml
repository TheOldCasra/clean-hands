# XcodeGen spec. Regenerate the project with:  cd ios && xcodegen generate
name: CleanHands
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  QA: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  CleanHands:
    type: application
    platform: iOS
    sources:
      - path: CleanHands
    info:
      path: CleanHands/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sw]
        NSCameraUsageDescription: "Kamera inaonyesha mikono yako tu. Picha hazihifadhiwi. / The camera shows your hands only. No images are stored."
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: CleanHands/CleanHands.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cleanhands.study
        APP_DISPLAY_NAME: Clean Hands
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: true
      configs:
        QA:
          # Separate app for gates 1-3 on the centre's iPads; never used in sessions (tasks T001).
          PRODUCT_BUNDLE_IDENTIFIER: org.cleanhands.study.qa
          APP_DISPLAY_NAME: Clean Hands QA
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconQA
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: QA_TOOLS
  CleanHandsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CleanHandsTests
    dependencies:
      - target: CleanHands
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.cleanhands.study.tests
schemes:
  CleanHands:
    build:
      targets:
        CleanHands: all
        CleanHandsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CleanHandsTests
    archive:
      config: Release
  CleanHands-QA:
    build:
      targets:
        CleanHands: all
    run:
      config: QA
    archive:
      config: QA
